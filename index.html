<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Score: <span id="score">0</span></h1>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over-message" style="display: none;">Game Over</div>
        <button id="restartButton" style="display: none;">Restart Game</button>
    </div>

    <div id="settings-panel">
        <h2>Settings</h2>
        <div>
            <label for="speedSlider">Speed: <span id="speedValue">100</span></label>
            <input type="range" id="speedSlider" min="50" max="200" value="100">
        </div>
        <div>
            <label for="pointsInput">Points per Food:</label>
            <input type="number" id="pointsInput" value="10">
        </div>
        <div>
            <label for="wallsToggle">Walls are Passable</label>
            <input type="checkbox" id="wallsToggle">
        </div>
        <div>
            <label for="boardSizeInput">Board Size (requires restart):</label>
            <input type="number" id="boardSizeInput" value="400">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
